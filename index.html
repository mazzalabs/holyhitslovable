<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://holy-hits-band.lovable.app/" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "Holy Hits Band",
      "url": "https://holy-hits-band.lovable.app/",
      "genre": ["Pop", "Rock"],
      "areaServed": {
        "@type": "City",
        "name": "Campinas"
      }
    }
    </script>

    <!-- Open Graph / WhatsApp / social preview – static so crawlers see them without JS -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://holy-hits-band.lovable.app/" />
    <meta property="og:title"       content="Holy Hits — Shows Pop Rock 80 e 90 | Formatos e Contratação" />
    <meta property="og:description" content="Shows da banda Holy Hits com os maiores clássicos do Pop Rock 80 90 e 2000: formatos acústico, banda completa e grandes eventos. Conheça os planos e contrate pelo WhatsApp." />
    <meta property="og:image"       content="https://holy-hits-band.lovable.app/favicon.png" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Holy Hits — Shows Pop Rock 80 e 90 | Formatos e Contratação" />
    <meta name="twitter:description" content="Shows da banda Holy Hits com os maiores clássicos do Pop Rock 80 90 e 2000: formatos acústico, banda completa e grandes eventos. Conheça os planos e contrate pelo WhatsApp." />
    <meta name="twitter:image"       content="https://holy-hits-band.lovable.app/favicon.png" />

    <!-- Google Fonts – preconnect for perf -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@200;300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- SEO meta tags are injected at runtime from src/config/brand.ts -->
    <!-- <title>Holy Hits — Shows Pop Rock 80 e 90 | Contrate seu Show</title> -->
    <title>Holy Hits Banda | Pop Rock Anos 80, 90 e 2000 | Shows e Eventos | Campinas SP</title>
    <meta
      name="description"
      content="Holy Hits Band: clássicos do pop e rock dos anos 80, 90 e 2000 com guitarras pesadas. Banda de Campinas para shows e eventos."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
